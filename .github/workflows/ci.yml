# Host-side checks that need no Unity licence: the controller C code (CTest:
# Opus mission bench with tolerance asserts at 100 and 500 Hz, the core's unit
# test, the tt_controller helper unit test, the FOC current loop against a dq
# PMSM plant, the CAN-FD drive bus, a wheel node on the PMSM plant over that
# bus, routes and the path tracker), the portable core cross-compiled for
# both of the car's MCUs and as a 32-bit program, and the Tools/ checks
# (verify.js, the generated parameter and route files).
#
# The Unity-side validators (OpusMissionRunner.RunHeadless etc.) need a
# licensed editor and stay a local step for now — see SIM_TO_REAL_PLAN VAL-02.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  controllers:
    name: Controllers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows/MSVC is what builds the shipping DLLs; Linux/gcc keeps the
        # portable core honest for the eventual MCU toolchain.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # Plugin copies go into the build tree, never into the Unity project.
        run: cmake -S Controllers -B build -DCMAKE_BUILD_TYPE=Release -DUNITY_PLUGIN_DIR="${{ github.workspace }}/build/plugins"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  embedded:
    # FW-11: the portable core (params, PID, Opus mission, FOC, the wheel
    # node, the drive bus) for both MCUs the car has (D6, Hardware/HW_00):
    # the wheel nodes' G431 (Cortex-M4F, single-precision FPU, the strictest)
    # and MAIN's H723 (Cortex-M7, double-precision FPU; MAIN-06). Warnings as
    # errors, -Wdouble-promotion included. Compile-only until the boards'
    # HALs exist.
    name: Core for ${{ matrix.mcu }} (arm-none-eabi)
    strategy:
      fail-fast: false
      matrix:
        include:
          - mcu: Cortex-M4F (node, G431)
            flags: -mcpu=cortex-m4 -mthumb -mfpu=fpv4-sp-d16 -mfloat-abi=hard
          - mcu: Cortex-M7 (main, H723)
            flags: -mcpu=cortex-m7 -mthumb -mfpu=fpv5-d16 -mfloat-abi=hard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: cmake -S Controllers -B build-arm -DTT_TARGET=embedded -DCMAKE_TOOLCHAIN_FILE="$PWD/Controllers/cmake/arm-none-eabi.cmake" -DTT_MCU_FLAGS="${{ matrix.flags }}" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-arm
      - name: Size
        run: arm-none-eabi-size -t build-arm/*.a

  host32:
    # FW-11: the same core as an ILP32 program (as Zephyr's native_sim does),
    # so `long` and pointer-size assumptions fail here and not on the MCU.
    name: Core as 32-bit host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Configure
        run: cmake -S Controllers -B build32 -DTT_TARGET=host -DCMAKE_C_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build32
      - name: Test
        run: ctest --test-dir build32 --output-on-failure

  tools:
    name: Tools checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: verify.js
        run: node Tools/verify.js
      - name: Generated parameters are up to date
        run: node Tools/gen_params.js --check
      - name: Generated routes are up to date (firmware tables and the sim's copies)
        run: node Tools/gen_route.js --check
      - name: Log decoder self-test
        run: node Tools/tt_log_decode.js --selftest
